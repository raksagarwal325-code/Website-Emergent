# -----------------------------------------------------------------------------
# CI — Samrat Glass Emporium (samratglass.com)
#
# Runs on every push and pull_request against `main`. Three parallel jobs:
#
#   1. backend         — pytest suite against an ephemeral MongoDB service
#                        started inside the job (never touches production data).
#   2. frontend-tests  — Jest / RTL suite via CRA/craco.
#   3. frontend-build  — Full production build + category prerender + a
#                        strict assertion that every expected category HTML
#                        file was actually emitted.
#
# All frontend installs use the committed `frontend/yarn.lock` in
# `--frozen-lockfile` mode, matching the tree audited on 2026-08-03 and
# committed at 0b5bc8b. Frozen-lockfile refuses to write, so any drift
# would abort the install (the whole point of the earlier lockfile audit).
#
# Tooling versions are pinned to the exact ones that already produce a
# clean build on the developer pod:
#
#     Node 20.20.2  ·  yarn 1.22.22  ·  Python 3.11
#
# NOTE — TEMPORARY REMOTE API DEPENDENCY
# --------------------------------------
# The `frontend-build` job passes `PRERENDER_API_URL=https://samratglass.com`
# so the `postbuild` script (`node scripts/prerender-categories.js`) can
# fetch real category data during the build. This mirrors exactly what the
# Emergent deploy container does and is what the successful audit ran with.
#
# The tradeoff: this couples CI health to the availability of the live
# production API. If samratglass.com is down (e.g. the 520 incident during
# the last deploy) then this job will fail, even though the code is fine.
#
# Follow-up work (out of scope for this PR): replace the remote API
# dependency with either:
#   (a) a deterministic CI fixture (checked-in JSON dump used only when
#       PRERENDER_MODE=fixture), or
#   (b) a lightweight local API booted inside the job (docker-compose
#       style) that returns a known-good product set.
# Track this as its own follow-up before adding branch-protection
# strictness that blocks merges on transient API outages.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    env:
      MONGO_URL: "mongodb://localhost:27017"
      DB_NAME: "test_ci_${{ github.run_id }}"
      ADMIN_EMAILS: "raks.agarwal325@gmail.com"
      REACT_APP_BACKEND_URL: "http://localhost:8001"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^\s*emergentintegrations([<>=!~ ].*)?$' backend/requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt

      - name: Wait for MongoDB to accept connections
        run: |
          python - <<'PY'
          import socket, time, sys
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with socket.create_connection(("localhost", 27017), 2):
                      print("mongo port open")
                      sys.exit(0)
              except OSError:
                  time.sleep(2)
          print("timed out waiting for mongo", file=sys.stderr); sys.exit(1)
          PY

      - name: Seed admin test session (matches conftest expectations)
        run: |
          echo "MONGO_URL=$MONGO_URL DB_NAME=$DB_NAME"

      - name: Prepare backend CI runtime
        run: |
          sudo mkdir -p /app/backend /app/frontend
          printf 'MONGO_URL=%s\nDB_NAME=%s\n' "$MONGO_URL" "$DB_NAME" \
            | sudo tee /app/backend/.env >/dev/null
          printf 'REACT_APP_BACKEND_URL=%s\n' "$REACT_APP_BACKEND_URL" \
            | sudo tee /app/frontend/.env >/dev/null

          sudo tee /usr/local/bin/mongosh >/dev/null <<'SH'
          #!/usr/bin/env bash
          set -e
          cid=$(docker ps --filter "ancestor=mongo:6" --format '{{.ID}}' | head -n1)
          if [ -z "$cid" ]; then
            echo "MongoDB service container not found" >&2
            exit 1
          fi
          exec docker exec "$cid" mongosh "$@"
          SH
          sudo chmod +x /usr/local/bin/mongosh

      - name: Start FastAPI backend on :8001
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app \
            --host 0.0.0.0 \
            --port 8001 \
            --workers 1 \
            > /tmp/backend.log 2>&1 &

          echo $! > /tmp/backend_worker_real.pid
          echo "Backend pid: $(cat /tmp/backend_worker_real.pid)"

          python - <<'PY'
          import sys
          import time
          import urllib.request

          deadline = time.time() + 90
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://localhost:8001/api/settings",
                      timeout=2,
                  ) as response:
                      if response.status == 200:
                          print("backend ready")
                          sys.exit(0)
              except Exception as exc:
                  last_error = repr(exc)

              time.sleep(1)

          print(
              f"timed out waiting for backend: {last_error}",
              file=sys.stderr,
          )
          sys.exit(1)
          PY

      - name: Run backend pytest (serial mode — matches audited-green run)
        working-directory: backend
        env:
          PYTEST_ADDOPTS: "-n 0"
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "--- /tmp/backend.log ---"
          tail -n 200 /tmp/backend.log || true

  frontend-tests:
    name: Frontend tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install (frozen lockfile — refuses to write)
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Run Jest suite
        env:
          CI: "true"
        run: yarn test --watchAll=false

  frontend-build:
    name: Frontend production build + prerender
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install (frozen lockfile — refuses to write)
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Production build + postbuild prerender
        env:
          PRERENDER_API_URL: "https://samratglass.com"
          REACT_APP_BACKEND_URL: "https://samratglass.com"
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: yarn build

      - name: Assert build/index.html exists and is non-empty
        run: |
          test -s build/index.html \
            || { echo "::error::build/index.html missing or empty"; exit 1; }

      - name: Assert every expected category prerender HTML file exists
        run: |
          set -euo pipefail
          expected_slugs=(
            chandeliers
            hanging-lights
            wall-lights
            table-lamps
            floor-lamps
            candle-stands
            floor-chandeliers
            table-chandeliers
            ceiling-lights
            gate-lights
          )
          missing=()
          for slug in "${expected_slugs[@]}"; do
            f="build/category/${slug}/index.html"
            if [ ! -s "$f" ]; then
              missing+=("$slug ($f)")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing/empty prerendered category HTML files:"
            printf '::error:: - %s\n' "${missing[@]}"
            exit 1
          fi
          found=$(ls build/category | sort)
          expected=$(printf '%s\n' "${expected_slugs[@]}" | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::Unexpected category directories under build/category/"
            echo "Expected:"; printf '  %s\n' "${expected_slugs[@]}"
            echo "Found:";    printf '  %s\n' $found
            exit 1
          fi
          echo "All 10 expected category HTML files present:"
          printf '  ✓ %s\n' "${expected_slugs[@]}"
