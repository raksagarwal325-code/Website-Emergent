name: IndexNow live sitemap submission

on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:00 IST. Product/admin changes can happen without a Git commit,
    # so submit the current live sitemap set once daily.
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: indexnow-live
  cancel-in-progress: true

jobs:
  submit:
    name: Submit live URLs to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20.20.2
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"

      - name: Submit URLs from live Samrat sitemaps
        run: node scripts/submit-indexnow.js
